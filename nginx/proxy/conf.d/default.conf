# Reverse proxy menuju service `web` (nginx statis) di network internal.
# Satu-satunya entri public: semua trafik masuk lewat sini.

upstream web_backend {
    server web:80;
    keepalive 16;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    access_log off;

    # Healthcheck proxy
    location = /healthz {
        return 200 'ok';
    }

    location / {
        proxy_pass         http://web_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Tidak ada cache di proxy; nginx `web` sudah handle
        # Cache-Control untuk aset ber-hash.
        proxy_buffering off;
    }
}

