server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gurat dasar keamanan
    server_tokens off;
    # Redirect internal parsial pakai path relatif, agar tidak menurunkan
    # https→http saat situs diakses lewat proxy/Cloudflare.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "0" always;

    # Gzip untuk teks
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/rss+xml application/manifest+json;

    # Aset ber-hash di _astro/ → cache lama (immutable)
    location ~* ^/_astro/.*\.(css|js|webp|avif|png|jpg|jpeg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Aset statis lain → cache 1 hari
    location ~* \.(svg|png|jpg|jpeg|webp|avif|ico|woff2?|json|txt|xml)$ {
        expires 1d;
    }

    # Healthcheck tanpa log
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Error page kustom
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    error_page 500 502 503 504 /50x.html;

    # Routing SPA-style: semua rute fallback ke file/index.html
    # HTML selalu revalidasi supaya deploy baru (aset ber-hash baru) langsung terlihat.
    location / {
        expires -1;
        # Sajikan /katalog, /produk/x, dll. langsung dari folder tanpa 301
        # ke versi trailing slash. HTML selalu revalidasi.
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }
}